<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Builder - AI Benchmark Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            user-select: none;
        }
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; color: #4ade80; }
        p { margin: 5px 0; font-size: 0.9rem; color: #ccc; }
        .color-picker {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
            width: 160px;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.active { border-color: white; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .controls { margin-top: 15px; font-size: 0.8rem; color: #888; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;}
        .key { display: inline-block; background: #333; padding: 2px 6px; border-radius: 4px; color: #fff; font-family: monospace; }
        
        button.action-btn {
            background: #4ade80;
            color: #111;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }
        button.action-btn:hover { background: #22c55e; }
    </style>
    <!-- Load Three.js from unpkg -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>VOXEL BUILDER</h2>
        <p>Interactive 3D Workspace</p>
        
        <div class="color-picker" id="colors">
            <!-- Populated by JS -->
        </div>

        <button class="action-btn" id="clear-btn">Clear All</button>

        <div class="controls">
            <p><span class="key">Left Click</span> to place</p>
            <p><span class="key">Shift+Click</span> to remove</p>
            <p><span class="key">Drag</span> to rotate view</p>
            <p><span class="key">Scroll</span> to zoom</p>
        </div>
    </div>
    
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(15, 20, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1; // Don't go below ground

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(20, 50, -20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 150;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // --- Grid and Ground ---
        const gridSize = 30;
        const gridHelper = new THREE.GridHelper(gridSize, gridSize, 0x444444, 0x222222);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        const planeGeo = new THREE.PlaneGeometry(gridSize, gridSize);
        planeGeo.rotateX(-Math.PI / 2);
        const planeMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a,
            roughness: 1,
            metalness: 0
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.receiveShadow = true;
        scene.add(plane);
        
        const objects = [plane]; // Objects array for raycasting

        // --- Builder Logic ---
        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        
        let buildingColor = 0x4ade80;

        // Roll-over helper (the ghost block)
        const rollOverGeo = new THREE.BoxGeometry(1.05, 1.05, 1.05);
        const rollOverMat = new THREE.MeshBasicMaterial({ color: 0xff0000, opacity: 0.5, transparent: true, wireframe: false });
        const rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMat);
        scene.add(rollOverMesh);

        let isDragging = false;
        let mouseDownPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#ui')) return; // Ignore clicks on UI
            isDragging = false;
            mouseDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (e.target.closest('#ui')) {
                rollOverMesh.visible = false;
                return;
            }

            if (Math.abs(e.clientX - mouseDownPos.x) > 3 || Math.abs(e.clientY - mouseDownPos.y) > 3) {
                isDragging = true;
            }

            pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                rollOverMesh.position.copy(intersect.point).add(intersect.face.normal);
                rollOverMesh.position.floor().addScalar(0.5);
                rollOverMesh.visible = true;
                rollOverMat.color.setHex(e.shiftKey ? 0xff0000 : buildingColor);
            } else {
                rollOverMesh.visible = false;
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('#ui') || isDragging) return;

            pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.shiftKey) {
                    // Delete block
                    if (intersect.object !== plane) {
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                    }
                } else {
                    // Create block
                    const voxelMat = new THREE.MeshStandardMaterial({ 
                        color: buildingColor,
                        roughness: 0.2,
                        metalness: 0.1
                    });
                    const voxel = new THREE.Mesh(cubeGeo, voxelMat);
                    voxel.position.copy(intersect.point).add(intersect.face.normal);
                    voxel.position.floor().addScalar(0.5);
                    
                    // Don't place out of bounds
                    if (Math.abs(voxel.position.x) < gridSize/2 && Math.abs(voxel.position.z) < gridSize/2 && voxel.position.y >= 0) {
                        voxel.castShadow = true;
                        voxel.receiveShadow = true;
                        scene.add(voxel);
                        objects.push(voxel);
                    }
                }
            }
        });

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- UI Setup ---
        const colors = [
            0x4ade80, 0x3b82f6, 0xef4444, 0xeab308, 0xa855f7, 
            0xec4899, 0xffffff, 0x9ca3af, 0xff9800, 0x00bcd4
        ];
        const colorPicker = document.getElementById('colors');
        
        colors.forEach((cHex, index) => {
            const btn = document.createElement('div');
            btn.className = 'color-btn' + (index === 0 ? ' active' : '');
            btn.style.backgroundColor = '#' + cHex.toString(16).padStart(6, '0');
            btn.onclick = () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                buildingColor = cHex;
                rollOverMat.color.setHex(cHex);
            };
            colorPicker.appendChild(btn);
        });

        document.getElementById('clear-btn').onclick = () => {
            const toRemove = objects.filter(obj => obj !== plane);
            toRemove.forEach(obj => {
                scene.remove(obj);
                objects.splice(objects.indexOf(obj), 1);
            });
        };

        // --- Initial Example Structure ---
        function placeBlock(x, y, z, color) {
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.1 });
            const voxel = new THREE.Mesh(cubeGeo, mat);
            voxel.position.set(x + 0.5, y + 0.5, z + 0.5);
            voxel.castShadow = true;
            voxel.receiveShadow = true;
            scene.add(voxel);
            objects.push(voxel);
        }

        // Build a little tree to show capability
        const brown = 0x8B4513, green = 0x228B22;
        placeBlock(0, 0, 0, brown);
        placeBlock(0, 1, 0, brown);
        placeBlock(0, 2, 0, brown);
        for(let i = -1; i <= 1; i++) {
            for(let j = -1; j <= 1; j++) {
                placeBlock(i, 3, j, green);
                if (Math.abs(i) + Math.abs(j) < 2) placeBlock(i, 4, j, green);
            }
        }
        placeBlock(0, 5, 0, green);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Pulse the rollover mesh
            const time = performance.now() * 0.005;
            rollOverMat.opacity = 0.3 + Math.sin(time) * 0.2;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
