<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Talking Fluffy 🐾 — 3D Interactive Virtual Pet</title>
  <!-- Three.js + GSAP + Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #ec4899;
      --primary-glow: rgba(236, 72, 153, 0.45);
      --accent: #8b5cf6;
      --bg-dark: #090d16;
      --card-bg: rgba(18, 24, 38, 0.72);
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Top Status Bar */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .stat-pill {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .meter-container {
      width: 110px;
      height: 10px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .meter-happy {
      background: linear-gradient(90deg, #ec4899, #f43f5e);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
      width: 65%;
    }

    .meter-hunger {
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      width: 80%;
    }

    /* Floating Speech Bubble */
    #speech-bubble {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(255, 255, 255, 0.95);
      color: #1e1b4b;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 20px rgba(236, 72, 153, 0.3);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 10px solid rgba(255, 255, 255, 0.95);
    }

    #speech-bubble.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Talking Mic Center Button */
    .mic-button-wrapper {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: 3px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.5), 0 0 20px rgba(139, 92, 246, 0.4);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mic-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 40px rgba(236, 72, 153, 0.7);
    }

    .mic-btn:active, .mic-btn.recording {
      transform: scale(0.95);
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.9);
      animation: pulse-ring 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .mic-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .quick-voice-btn {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .quick-voice-btn:hover {
      background: #ec4899;
      color: #fff;
      border-color: #fff;
      transform: scale(1.06);
    }
    .quick-voice-btn:active {
      transform: scale(0.95);
    }

    /* IconScout 3D Action Dock */
    .action-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 28px;
      display: flex;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.15);
      max-width: 95vw;
      overflow-x: auto;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 10px 14px;
      min-width: 72px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dock-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-8px) scale(1.08);
      border-color: rgba(236, 72, 153, 0.5);
      box-shadow: 0 12px 25px rgba(236, 72, 153, 0.3);
    }

    .dock-item:active {
      transform: translateY(-2px) scale(0.96);
    }

    .dock-icon-3d {
      font-size: 2rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
      transition: transform 0.25s ease;
    }

    .dock-item:hover .dock-icon-3d {
      transform: scale(1.15) rotate(-5deg);
    }

    .dock-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Accessory Toggle Strip */
    .accessories-strip {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .acc-btn {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .acc-btn:hover {
      transform: scale(1.12);
      border-color: #ec4899;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
    }

    .acc-btn.active {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-color: #fff;
    }

    /* Click/Tap ripple particles */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 1.8rem;
      animation: float-up 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
      z-index: 20;
    }

    @keyframes float-up {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(-50%, -100px) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -160px) scale(1); }
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Studio Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Status Stats -->
  <div class="top-bar">
    <div class="stat-pill">
      <span>💖 HAPPINESS</span>
      <div class="meter-container">
        <div id="meter-happy" class="meter-fill meter-happy"></div>
      </div>
      <span id="happy-val" style="font-size: 0.85rem; font-weight: 800; color: #f43f5e;">75%</span>
    </div>

    <!-- Explicit Audio Unlock & Test Button -->
    <button id="btn-sound-test" class="stat-pill" style="cursor: pointer; background: linear-gradient(135deg, #ec4899, #8b5cf6); border: 2px solid #fff; color: #fff; font-weight: 800; box-shadow: 0 0 20px rgba(236,72,153,0.6);">
      <span>🔊 UNMUTE & TEST SOUND</span>
    </button>

    <div class="stat-pill">
      <span>🐟 FULLNESS</span>
      <div class="meter-container">
        <div id="meter-hunger" class="meter-fill meter-hunger"></div>
      </div>
      <span id="hunger-val" style="font-size: 0.85rem; font-weight: 800; color: #38bdf8;">80%</span>
    </div>
  </div>

  <!-- Speech Bubble -->
  <div id="speech-bubble">
    <span id="speech-icon">😺</span>
    <span id="speech-text">Purrr! Tap anywhere to activate sound!</span>
  </div>

  <!-- Accessories Sidebar -->
  <div class="accessories-strip">
    <button id="btn-acc-shades" class="acc-btn" title="Toggle Sunglasses">🕶️</button>
    <button id="btn-acc-hat" class="acc-btn" title="Toggle Party Hat">🎩</button>
    <button id="btn-acc-crown" class="acc-btn" title="Toggle Royal Crown">👑</button>
    <button id="btn-acc-bowtie" class="acc-btn" title="Toggle Bowtie">🎀</button>
  </div>

  <!-- Center Talking Tom Mic & Voice Box -->
  <div class="mic-button-wrapper">
    <div style="display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center;">
      <button class="quick-voice-btn" data-text="Hello human! I am Fluffy! Meow!">👋 Hello</button>
      <button class="quick-voice-btn" data-text="I am starving! Give me yummy fish right now!">🐟 Feed Me</button>
      <button class="quick-voice-btn" data-text="Hahaha that tickles! Stop it silly!">😂 Tickle</button>
      <button class="quick-voice-btn" data-text="I love you so much! Purrrrr!">❤️ I Love You</button>
      <button class="quick-voice-btn" data-text="Meow meow meow! La la la! Purr!">🎵 Sing Song</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="mic-btn" class="mic-btn" title="Record Voice">🎤</button>
      <div style="display: flex; gap: 6px; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 25px rgba(0,0,0,0.4);">
        <input id="cat-say-input" type="text" placeholder="Type words for cat to say..." style="background: transparent; border: none; outline: none; color: #fff; font-size: 0.9rem; width: 190px;">
        <button id="btn-say-custom" style="background: #ec4899; border: none; color: #fff; font-size: 0.8rem; font-weight: 800; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: transform 0.15s ease;">SAY</button>
      </div>
    </div>
    <span id="mic-label" class="mic-label">CLICK MIC TO RECORD OR CHOOSE A BUTTON</span>
  </div>

  <!-- IconScout Style 3D Action Dock -->
  <div class="action-dock">
    <div class="dock-item" id="act-fish">
      <span class="dock-icon-3d">🐟</span>
      <span class="dock-title">Fish Treat</span>
    </div>

    <div class="dock-item" id="act-milk">
      <span class="dock-icon-3d">🥛</span>
      <span class="dock-title">Warm Milk</span>
    </div>

    <div class="dock-item" id="act-yarn">
      <span class="dock-icon-3d">🧶</span>
      <span class="dock-title">Yarn Ball</span>
    </div>

    <div class="dock-item" id="act-pat">
      <span class="dock-icon-3d">🪮</span>
      <span class="dock-title">Brush Fur</span>
    </div>

    <div class="dock-item" id="act-nap">
      <span class="dock-icon-3d">💤</span>
      <span class="dock-title">Cat Nap</span>
    </div>
  </div>

  <script>
    // ==========================================
    // HIGH-VOLUME AUDIO ENGINE & PITCH SHIFTER
    // ==========================================
    class CatSoundSystem {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.purrOsc = null;
        this.purrGain = null;
        this.isPurring = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime); // LOUD & CRISP
            this.masterGain.connect(this.ctx.destination);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const now = this.ctx.currentTime;
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.05);
      }

      startPurr() {
        this.init();
        if (!this.ctx || this.isPurring) return;
        this.isPurring = true;

        this.purrOsc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        this.purrGain = this.ctx.createGain();

        // 28Hz rhythmic cat purr
        this.purrOsc.type = 'triangle';
        this.purrOsc.frequency.setValueAtTime(28, this.ctx.currentTime);

        lfo.frequency.setValueAtTime(4.5, this.ctx.currentTime);
        lfoGain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        this.purrGain.gain.setValueAtTime(0.4, this.ctx.currentTime); // Boosted purr

        lfo.connect(lfoGain);
        lfoGain.connect(this.purrGain.gain);
        this.purrOsc.connect(this.purrGain);
        this.purrGain.connect(this.masterGain);

        this.purrOsc.start();
        lfo.start();
      }

      stopPurr() {
        if (!this.isPurring || !this.purrGain) return;
        this.isPurring = false;
        try {
          this.purrGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
          setTimeout(() => {
            if (this.purrOsc) this.purrOsc.stop();
          }, 200);
        } catch(e) {}
      }

      meow(pitch = 1.0) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Dual oscillator for rich harmonic cat voice
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(360 * pitch, now);
        osc1.frequency.exponentialRampToValueAtTime(740 * pitch, now + 0.15);
        osc1.frequency.exponentialRampToValueAtTime(320 * pitch, now + 0.45);

        osc2.frequency.setValueAtTime(720 * pitch, now);
        osc2.frequency.exponentialRampToValueAtTime(1480 * pitch, now + 0.15);
        osc2.frequency.exponentialRampToValueAtTime(640 * pitch, now + 0.45);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.65, now + 0.1); // LOUD
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.masterGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.45);
        osc2.stop(now + 0.45);
      }

      crunch() {
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 5; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const time = this.ctx.currentTime + (i * 0.07);
          osc.frequency.setValueAtTime(200 + Math.random() * 120, time);
          gain.gain.setValueAtTime(0.5, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + 0.06);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.06);
        }
      }

      slurp() {
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 6; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const time = this.ctx.currentTime + (i * 0.05);
          osc.frequency.setValueAtTime(350 + (i * 110), time);
          gain.gain.setValueAtTime(0.4, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.04);
        }
      }
    }

    const catSound = new CatSoundSystem();

    // Auto-unlock audio on ANY first click/tap anywhere on the window
    ['click', 'touchstart', 'mousedown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, () => {
        catSound.init();
      }, { once: false });
    });

    // ==========================================
    // TALKING TOM SPEECH SYNTHESIS (100% Guaranteed Voice)
    // ==========================================
    function speakAsCat(text) {
      catSound.init();
      say(text, "🗣️");
      animateCatTalking(Math.max(1.5, text.length * 0.08));

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 1.95; // Ultra-squeaky Talking Tom Helium Voice!
        utterance.rate = 1.25;  // Fast & funny

        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
          const cuteVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Samantha')));
          if (cuteVoice) utterance.voice = cuteVoice;
        }

        window.speechSynthesis.speak(utterance);
      } else {
        // Fallback meow
        catSound.meow(1.4);
      }
    }

    // Top Sound Test Button
    document.getElementById('btn-sound-test').addEventListener('click', () => {
      catSound.init();
      catSound.meow(1.2);
      speakAsCat("Meow! Sound is completely working! Talk to me!");
      confetti({ particleCount: 30, spread: 50, origin: { y: 0.3 } });
    });

    // Quick Voice Buttons
    document.querySelectorAll('.quick-voice-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        catSound.playClick();
        const text = btn.getAttribute('data-text');
        speakAsCat(text);
      });
    });

    // Custom Say Input
    document.getElementById('btn-say-custom').addEventListener('click', (e) => {
      e.stopPropagation();
      catSound.playClick();
      const input = document.getElementById('cat-say-input');
      const text = input.value.trim();
      if (text) {
        speakAsCat(text);
        input.value = '';
      }
    });

    document.getElementById('cat-say-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('btn-say-custom').click();
      }
    });

    // ==========================================
    // TALKING TOM MICROPHONE PITCH-SHIFTER
    // ==========================================
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const micBtn = document.getElementById('mic-btn');
    const micLabel = document.getElementById('mic-label');

    micBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      catSound.init();
      catSound.playClick();
      if (!isRecording) {
        startVoiceRecording();
      } else {
        stopVoiceRecording();
      }
    });

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          options = { mimeType: 'audio/webm;codecs=opus' };
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          options = { mimeType: 'audio/mp4' };
        }

        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = playBackSqueakyVoice;

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
        micLabel.innerText = 'LISTENING... CLICK WHEN FINISHED';
        say('Listening to you! Speak now...', '👂');
      } catch (err) {
        console.warn('Mic access denied or unavailable:', err);
        say("Can't access mic! Use the quick voice buttons below!", '⚠️');
        speakAsCat("I can't hear your mic, but you can click the buttons or type to make me talk!");
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        micLabel.innerText = 'PLAYING SQUEAKY VOICE!';
      }
    }

    async function playBackSqueakyVoice() {
      try {
        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const arrayBuffer = await audioBlob.arrayBuffer();
        
        catSound.ctx.decodeAudioData(arrayBuffer, (audioBuffer) => {
          const source = catSound.ctx.createBufferSource();
          source.buffer = audioBuffer;

          // 1.55x Pitch Shift (Classic Talking Tom Helium Voice)
          source.playbackRate.value = 1.55;

          const gain = catSound.ctx.createGain();
          gain.gain.value = 1.2; // LOUD
          source.connect(gain);
          gain.connect(catSound.masterGain);

          source.start();
          animateCatTalking(audioBuffer.duration / 1.55);
        }, (decodeErr) => {
          console.error("Decode error, using speech synthesis fallback:", decodeErr);
          speakAsCat("You said something, and I loved it! Meow!");
        });
      } catch(e) {
        speakAsCat("Meow! Nice to hear you!");
      }
    }

    function animateCatTalking(durationSeconds) {
      say('Talking back to you! 😂', '🗣️');
      const tl = gsap.timeline({ repeat: Math.ceil(durationSeconds * 4), yoyo: true });
      tl.to(catGroup.scale, { y: 1.14, x: 0.92, duration: 0.12, ease: "power1.inOut" })
        .to(catGroup.rotation, { z: 0.08, duration: 0.12, ease: "power1.inOut" });

      setTimeout(() => {
        gsap.to(catGroup.scale, { x: 1, y: 1, duration: 0.3 });
        gsap.to(catGroup.rotation, { z: 0, duration: 0.3 });
        micLabel.innerText = 'CLICK MIC TO RECORD OR CHOOSE A BUTTON';
      }, durationSeconds * 1000);
    }

    // ==========================================
    // THREE.JS 3D SCENE & RIGGING
    // ==========================================
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090d16, 0.035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 5.2);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainSpot = new THREE.SpotLight(0xffd1dc, 2.2);
    mainSpot.position.set(2, 6, 4);
    mainSpot.angle = Math.PI / 4;
    mainSpot.penumbra = 0.5;
    mainSpot.castShadow = true;
    scene.add(mainSpot);

    const rimLight = new THREE.PointLight(0x8b5cf6, 3, 10);
    rimLight.position.set(-3, 2, -2);
    scene.add(rimLight);

    const pinkFill = new THREE.PointLight(0xec4899, 2.5, 10);
    pinkFill.position.set(3, 1, 2);
    scene.add(pinkFill);

    // 3D Studio Pedestal / Cushion
    const pedestalGeo = new THREE.CylinderGeometry(1.8, 2.1, 0.4, 64);
    const pedestalMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.4,
      metalness: 0.2
    });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -0.7;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    // Glowing Pedestal Ring
    const ringGeo = new THREE.TorusGeometry(1.85, 0.035, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xec4899 });
    const glowRing = new THREE.Mesh(ringGeo, ringMat);
    glowRing.rotation.x = Math.PI / 2;
    glowRing.position.y = -0.5;
    scene.add(glowRing);

    // ==========================================
    // THE CAT RIG (3D Mesh + Texture + Accessories)
    // ==========================================
    const catGroup = new THREE.Group();
    scene.add(catGroup);

    // Load Cat Photo Texture
    const textureLoader = new THREE.TextureLoader();
    const catTexture = textureLoader.load('cat.jpg');

    // Cat Body (Curved Disc / Capsule Avatar with depth)
    const catBodyGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.15, 64);
    const catBodyMat = new THREE.MeshStandardMaterial({
      map: catTexture,
      roughness: 0.5,
      metalness: 0.1
    });
    // Rotate texture to face front
    const catBody = new THREE.Mesh(catBodyGeo, catBodyMat);
    catBody.rotation.x = Math.PI / 2;
    catBody.castShadow = true;
    catGroup.add(catBody);

    // Cute 3D Fluffy Ears
    const earGeo = new THREE.ConeGeometry(0.35, 0.65, 32);
    const earMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.6 });

    const leftEar = new THREE.Mesh(earGeo, earMat);
    leftEar.position.set(-0.72, 1.05, 0);
    leftEar.rotation.z = 0.35;
    catGroup.add(leftEar);

    const rightEar = new THREE.Mesh(earGeo, earMat);
    rightEar.position.set(0.72, 1.05, 0);
    rightEar.rotation.z = -0.35;
    catGroup.add(rightEar);

    // 3D ACCESSORIES
    // 1. Thug Life Sunglasses
    const shadesGroup = new THREE.Group();
    const glassGeo = new THREE.BoxGeometry(0.55, 0.28, 0.08);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.1, metalness: 0.8 });
    const lGlass = new THREE.Mesh(glassGeo, glassMat);
    lGlass.position.set(-0.35, 0.22, 0.15);
    const rGlass = new THREE.Mesh(glassGeo, glassMat);
    rGlass.position.set(0.35, 0.22, 0.15);
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.05), glassMat);
    bridge.position.set(0, 0.24, 0.15);
    shadesGroup.add(lGlass, rGlass, bridge);
    shadesGroup.visible = false;
    catGroup.add(shadesGroup);

    // 2. Party Cone Hat
    const hatGeo = new THREE.ConeGeometry(0.45, 0.9, 32);
    const hatMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, roughness: 0.3, metalness: 0.4 });
    const partyHat = new THREE.Mesh(hatGeo, hatMat);
    partyHat.position.set(0, 1.35, 0);
    partyHat.visible = false;
    catGroup.add(partyHat);

    // 3. Royal Golden Crown
    const crownGroup = new THREE.Group();
    const crownBase = new THREE.CylinderGeometry(0.48, 0.45, 0.25, 6, 1, true);
    const crownMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.85, roughness: 0.2 });
    const crownMesh = new THREE.Mesh(crownBase, crownMat);
    crownGroup.add(crownMesh);
    crownGroup.position.set(0, 1.25, 0);
    crownGroup.visible = false;
    catGroup.add(crownGroup);

    // 4. Elegant Bowtie
    const bowGroup = new THREE.Group();
    const bowWingGeo = new THREE.ConeGeometry(0.25, 0.45, 16);
    const bowMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e });
    const lBow = new THREE.Mesh(bowWingGeo, bowMat);
    lBow.rotation.z = Math.PI / 2;
    lBow.position.set(-0.24, -0.95, 0.16);
    const rBow = new THREE.Mesh(bowWingGeo, bowMat);
    rBow.rotation.z = -Math.PI / 2;
    rBow.position.set(0.24, -0.95, 0.16);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), bowMat);
    knot.position.set(0, -0.95, 0.18);
    bowGroup.add(lBow, rBow, knot);
    bowGroup.visible = false;
    catGroup.add(bowGroup);

    // Accessories Toggles
    setupToggle('btn-acc-shades', shadesGroup, 'Cool shades on! 😎');
    setupToggle('btn-acc-hat', partyHat, 'Party time! 🎉');
    setupToggle('btn-acc-crown', crownGroup, 'All hail King Fluffy! 👑');
    setupToggle('btn-acc-bowtie', bowGroup, 'Dapper kitty! 🎀');

    function setupToggle(btnId, object3D, msg) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        catSound.init();
        catSound.meow(1.2);
        object3D.visible = !object3D.visible;
        btn.classList.toggle('active', object3D.visible);
        if (object3D.visible) {
          say(msg, btn.innerText);
          confetti({ particleCount: 30, spread: 45, origin: { y: 0.6 } });
        }
      });
    }

    // ==========================================
    // RAYCASTING & INTERACTIVE TOUCH/CLICK
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isPetting = false;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      // Smooth 3D Head Tracking towards mouse
      gsap.to(catGroup.rotation, {
        y: mouse.x * 0.35,
        x: -mouse.y * 0.25,
        duration: 0.4,
        ease: "power1.out"
      });

      if (isPetting) {
        spawnHeart(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mousedown', (e) => {
      catSound.init();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([catBody, leftEar, rightEar]);

      if (intersects.length > 0) {
        isPetting = true;
        catSound.startPurr();
        catSound.meow(1.1);
        boostStat('happy', 8);
        say("Purrrr! That feels so good! ❤️", "😻");

        // Squash & stretch reaction
        gsap.to(catGroup.scale, {
          y: 0.88,
          x: 1.12,
          duration: 0.15,
          yoyo: true,
          repeat: 1,
          ease: "power2.out"
        });

        spawnHeart(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      if (isPetting) {
        isPetting = false;
        catSound.stopPurr();
      }
    });

    function spawnHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = ['💖', '✨', '🐾', '😻'][Math.floor(Math.random() * 4)];
      heart.style.left = x + (Math.random() * 40 - 20) + 'px';
      heart.style.top = y + (Math.random() * 40 - 20) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    // ==========================================
    // ACTIONS & ANIMATIONS (Feed, Milk, Yarn, Nap)
    // ==========================================
    const speechBubble = document.getElementById('speech-bubble');
    const speechText = document.getElementById('speech-text');
    const speechIcon = document.getElementById('speech-icon');
    let speechTimeout = null;

    function say(text, icon = '😺') {
      speechText.innerText = text;
      speechIcon.innerText = icon;
      speechBubble.classList.add('active');
      clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => {
        speechBubble.classList.remove('active');
      }, 3500);
    }

    function boostStat(stat, amount) {
      const el = document.getElementById(`meter-${stat}`);
      const valEl = document.getElementById(`${stat}-val`);
      let cur = parseInt(valEl.innerText);
      cur = Math.min(100, cur + amount);
      valEl.innerText = cur + '%';
      el.style.width = cur + '%';

      if (cur >= 100) {
        confetti({ particleCount: 80, spread: 80, origin: { y: 0.5 } });
      }
    }

    // 1. Feed Fish
    document.getElementById('act-fish').addEventListener('click', () => {
      catSound.init();
      catSound.crunch();
      boostStat('hunger', 15);
      boostStat('happy', 10);
      speakAsCat("Yummy salmon! Thank you human!");

      // 3D Bounce and eat animation
      gsap.timeline()
        .to(catGroup.position, { y: 0.4, duration: 0.15, ease: "power2.out" })
        .to(catGroup.position, { y: 0, duration: 0.25, ease: "bounce.out" });
    });

    // 2. Give Warm Milk
    document.getElementById('act-milk').addEventListener('click', () => {
      catSound.init();
      catSound.slurp();
      boostStat('hunger', 10);
      boostStat('happy', 12);
      speakAsCat("Slurp slurp! Warm milk is the best!");

      gsap.to(catGroup.rotation, { z: 0.15, duration: 0.2, yoyo: true, repeat: 3 });
    });

    // 3. Play Yarn Ball
    document.getElementById('act-yarn').addEventListener('click', () => {
      catSound.init();
      catSound.meow(1.3);
      boostStat('happy', 20);
      speakAsCat("Catch the yarn! Wheeee!");

      // Cat backflip / spin
      gsap.to(catGroup.rotation, {
        x: Math.PI * 2,
        duration: 0.6,
        ease: "power2.inOut",
        onComplete: () => catGroup.rotation.x = 0
      });
      confetti({ particleCount: 40, spread: 60 });
    });

    // 4. Brush Fur
    document.getElementById('act-pat').addEventListener('click', () => {
      catSound.init();
      catSound.startPurr();
      boostStat('happy', 15);
      speakAsCat("My fur is so shiny! Purrrr!");
      setTimeout(() => catSound.stopPurr(), 2500);

      gsap.to(catGroup.scale, { x: 1.08, y: 1.08, duration: 0.3, yoyo: true, repeat: 2 });
    });

    // 5. Cat Nap
    document.getElementById('act-nap').addEventListener('click', () => {
      catSound.init();
      speakAsCat("I am sleepy... goodnight!");
      
      gsap.to(mainSpot, { intensity: 0.4, duration: 1 });
      gsap.to(catGroup.position, { y: -0.3, duration: 0.8 });
      gsap.to(catGroup.scale, { y: 0.75, x: 1.25, duration: 0.8 });

      setTimeout(() => {
        gsap.to(mainSpot, { intensity: 2.2, duration: 1 });
        gsap.to(catGroup.position, { y: 0, duration: 0.5 });
        gsap.to(catGroup.scale, { y: 1, x: 1, duration: 0.5 });
        catSound.meow(1.0);
        speakAsCat("Good morning! Ready to play!");
      }, 3500);
    });

    // ==========================================
    // RENDER / IDLE ANIMATION LOOP
    // ==========================================
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Idle natural breathing cycle
      if (!isRecording) {
        catBody.scale.x = 1 + Math.sin(t * 2.5) * 0.02;
        catBody.scale.y = 1 + Math.cos(t * 2.5) * 0.025;
        glowRing.rotation.z = t * 0.5;

        // Subtle ear twitch
        leftEar.rotation.z = 0.35 + Math.sin(t * 5) * 0.03;
        rightEar.rotation.z = -0.35 - Math.sin(t * 5) * 0.03;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
